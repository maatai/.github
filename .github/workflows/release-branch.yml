name: Release branch

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-branch-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release branch or backport hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
          TZ: America/Mexico_City
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pr=$(gh api "repos/$REPO/commits/$MERGE_SHA/pulls" --jq '.[0] // {} | [.number // "", .head.ref // ""] | @tsv')
          IFS=$'\t' read -r pr_number head_ref <<< "$pr"

          comment() {
            if [[ -n "$pr_number" ]]; then
              gh pr comment "$pr_number" --repo "$REPO" --body "$1"
            fi
          }

          if [[ "$head_ref" != hotfix/* ]]; then
            branch="release-$(date +%d-%m-%y)"
            git push --force origin "$MERGE_SHA:refs/heads/$branch"
            echo "$branch -> $MERGE_SHA"
            exit 0
          fi

          release=$(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/release-*' \
            | { grep -E '^release-[0-9]{2}-[0-9]{2}-([0-9]{2}|[0-9]{4})$' || true; } \
            | awk -F- '{ year = length($4) == 2 ? "20" $4 : $4; print year $3 $2, $0 }' \
            | sort -r | head -n1 | cut -d' ' -f2)

          if [[ -z "$release" ]]; then
            comment ":warning: No se encontró ninguna rama \`release-DD-MM-YY\` para bajar este hotfix. Hay que hacerlo a mano."
            exit 1
          fi

          git switch -c "$release" "origin/$release"
          mainline=()
          if (( $(git rev-list --parents -n1 "$MERGE_SHA" | wc -w) > 2 )); then
            mainline=(-m 1)
          fi

          if git cherry-pick -x "${mainline[@]}" "$MERGE_SHA"; then
            git push origin "HEAD:refs/heads/$release"
            comment ":white_check_mark: Hotfix bajado a \`$release\`."
          else
            git cherry-pick --abort
            comment ":x: El hotfix tiene conflictos con \`$release\` y no se bajó. Hay que hacerlo a mano."
            exit 1
          fi
